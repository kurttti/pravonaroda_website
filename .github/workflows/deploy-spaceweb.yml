name: Deploy to SpaceWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: spaceweb-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pravonaroda.ru/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.1"
          extensions: curl, mbstring, openssl
          tools: composer:v2.2

      - name: Install dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --working-dir=spaceweb --no-dev --prefer-dist --no-interaction --no-progress

      - name: Test PHP request handling
        run: |
          php spaceweb/tests/request-validation-test.php
          php spaceweb/tests/rate-limiter-test.php
          php spaceweb/tests/contact-mailer-test.php
          php spaceweb/tests/bitrix24-crm-test.php
          php spaceweb/tests/incident-log-test.php

      - name: Build static site
        run: npm run build:spaceweb

      - name: Install deployment client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy to SpaceWeb
        env:
          SWEB_FTP_HOST: ${{ secrets.SWEB_FTP_HOST }}
          SWEB_FTP_USERNAME: ${{ secrets.SWEB_FTP_USERNAME }}
          SWEB_FTP_PASSWORD: ${{ secrets.SWEB_FTP_PASSWORD }}
        run: |
          lftp -u "${SWEB_FTP_USERNAME},${SWEB_FTP_PASSWORD}" "ftp://${SWEB_FTP_HOST}" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            mirror --reverse --delete --verbose --exclude-glob cgi-bin/** spaceweb-dist/ /pravonaroda_ru/public_html/;
            mirror --reverse --delete --verbose spaceweb-private-dist/ /pravonaroda_ru/app/;
            bye
          "

      - name: Notify search engines via IndexNow
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fpravonaroda.ru%2F&key=c8319e9d74529ea1fccac31b09341b04&keyLocation=https%3A%2F%2Fpravonaroda.ru%2Fc8319e9d74529ea1fccac31b09341b04.txt"
